html{-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none;-webkit-text-size-adjust:100%}
a,button,summary,.item{touch-action:manipulation}
body{padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
.notice,.lesson,.lesson p,.lesson li,.lesson h3,.item b,.item small,.card,dd,dt{overflow-wrap:anywhere;word-break:break-word}
.lesson table{word-break:normal;overflow-wrap:normal}
main a[href^="#curso-"]:not(.btn):not(.item):not(.ccard):not(.plate),main a[href="#home"]{display:inline-flex;align-items:center;min-height:44px}
details.card summary,details.mat summary{min-height:44px !important;display:flex;align-items:center}
#skip{min-height:44px;display:inline-flex;align-items:center}
@media(hover:none){.item:hover,.ccard:hover,.btn:hover{transform:none;box-shadow:none}}

:root{--navy:#082E9C;--blue:#1447D6;--sky:#48A8F6;--orange:#F68B1F;--yellow:#F7B547;--ink:#2D2D2D;--mute:#4A5568;--bg:#F4F6FC;--card:#fff;--ok:#0F7B4B;--okbg:#E5F6EE;--bad:#B3261E;--badbg:#FDEBEA;--line:#DDE3F2;--r:14px}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:Poppins,system-ui,sans-serif;color:var(--ink);background:var(--bg);line-height:1.6;font-size:16px}
button{font:inherit;cursor:pointer}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px;border-radius:6px}
h1:focus,main:focus,.fb:focus{outline:none}.skip{position:absolute;left:-999px;top:0;background:#fff;padding:8px 14px;z-index:99}.skip:focus{left:8px;top:8px}
header.top{background:var(--navy);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20}
header.top img{height:34px;background:#fff;border-radius:8px;padding:2px 6px}
header.top .t{font-weight:600;font-size:14px;line-height:1.2;flex:1;min-width:0}
header.top .t small{display:block;font-weight:400;opacity:.8;font-size:12px}
.who{font-size:12px;background:rgba(255,255,255,.14);padding:4px 10px;border-radius:99px;white-space:nowrap;max-width:40vw;overflow:hidden;text-overflow:ellipsis}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:20;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs a{flex:1;text-align:center;text-decoration:none;color:var(--mute);font-size:11px;padding:8px 2px 6px;font-weight:500;min-height:48px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs a svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs a[aria-current=page]{color:var(--navy);font-weight:700;box-shadow:inset 0 3px 0 var(--orange)}
main{padding:16px 16px 96px;max-width:860px;margin:0 auto}
h1,h2,h3{line-height:1.25;color:var(--navy)}h1{font-size:26px;margin:.2em 0 .4em}h2{font-size:21px;margin:1.4em 0 .5em}h3{font-size:17px;margin:1.3em 0 .4em}
.card>p:first-child{margin-top:0}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:0 0 12px}
.hero{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;border-radius:18px;padding:22px 18px;margin-bottom:14px}
.hero h1{color:#fff;margin:0 0 6px}.hero p{margin:.3em 0;opacity:.95}
.btn{display:inline-block;background:var(--orange);color:#1b1200;border:0;border-radius:10px;padding:11px 18px;font-weight:600;text-decoration:none;min-height:44px}
.btn.sec{background:#fff;color:var(--navy);border:2px solid var(--navy)}.btn.ghost{background:transparent;color:var(--navy);border:1px solid var(--line)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
:root{--resize-dur:300ms;--resize-ease:cubic-bezier(0.22,1,0.36,1)}
.t-resize{transition:width var(--resize-dur) var(--resize-ease),height var(--resize-dur) var(--resize-ease);will-change:width,height}
@media (prefers-reduced-motion:reduce){.t-resize{transition:none!important}}
details.card{interpolate-size:allow-keywords}
details.card::details-content{height:0;overflow:clip;transition:height var(--resize-dur) var(--resize-ease),content-visibility var(--resize-dur) allow-discrete}
details.card[open]::details-content{height:auto}
@media (prefers-reduced-motion:reduce){details.card::details-content{transition:none!important}}
.lh-meta{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin:2px 0 16px;color:var(--mute);font-size:14px}
.outline{border:1px solid #CFD4CC;border-left:4px solid var(--board);background:#fff;padding:12px 16px;margin:0 0 20px;border-radius:4px}
.outline ol{margin:6px 0 0;padding-left:20px}.outline li{margin:0}
.outline li{padding:4px 0}.outline [data-s]{color:var(--board);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.lfoot{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;margin-top:20px}
.bar{height:10px;background:#E4E9F7;border-radius:99px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--orange);border-radius:99px}
.hero .bar{background:rgba(255,255,255,.25)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 10px;border-radius:99px;background:#E4EAFB;color:var(--navy)}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.bad{background:var(--badbg);color:var(--bad)}.pill.or{background:#FFEBD2;color:#8a4a00}
.item{display:flex;gap:12px;align-items:center;text-decoration:none;color:inherit;padding:14px;border:1px solid var(--line);border-radius:var(--r);background:#fff;margin-bottom:8px;min-height:60px}
.item .dot{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:14px;color:#fff;font-weight:700}
.item .dot.done{background:var(--ok);border-color:var(--ok)}
.item b{display:block;font-size:15px}.item small{color:var(--mute)}
.lesson{font-size:17px}.lesson p,.lesson li{max-width:70ch}.lesson table{border-collapse:collapse;width:100%;font-size:14px;display:block;overflow-x:auto}
.lesson th,.lesson td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}.lesson th{background:#EAF0FF;color:var(--navy)}
.lesson figure{margin:12px 0}.lesson img{max-width:100%;height:auto;border-radius:10px;background:#fff}.lesson figcaption{font-size:13px;color:var(--mute)}
.lesson blockquote{border-left:4px solid var(--orange);margin:12px 0;padding:4px 14px;background:#FFF6E8;border-radius:0 10px 10px 0}
.qimg{max-width:100%;height:auto;border-radius:10px;background:#fff;border:1px solid var(--line);margin:8px 0}
.alt{display:flex;gap:10px;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:12px;padding:12px;margin:8px 0;min-height:48px;align-items:flex-start;color:var(--ink)}
.alt .l{flex:none;width:30px;height:30px;border-radius:50%;background:#E4EAFB;color:var(--navy);font-weight:700;display:grid;place-items:center}
.alt[aria-pressed=true]{border-color:var(--blue);background:#EEF3FF}.alt[aria-pressed=true] .l{background:var(--blue);color:#fff}
.alt.right{border-color:var(--ok);background:var(--okbg)}.alt.right .l{background:var(--ok);color:#fff}
.alt.wrong{border-color:var(--bad);background:var(--badbg)}.alt.wrong .l{background:var(--bad);color:#fff}
.exp{font-size:14px;color:var(--mute);margin:-2px 0 8px 40px}
.letters{display:flex;gap:8px;flex-wrap:wrap}.letters .alt{width:auto;min-width:64px;justify-content:center}
details.card summary{font-weight:600;color:var(--navy);cursor:pointer;min-height:32px}
.fb{border-radius:12px;padding:12px 14px;margin:12px 0;font-weight:500}.fb.ok{background:var(--okbg);color:var(--ok)}.fb.bad{background:var(--badbg);color:var(--bad)}
.notice{background:#FFF6E8;border:1px solid var(--yellow);border-radius:12px;padding:10px 14px;font-size:14px;margin-bottom:12px}
input[type=search],input[type=text],textarea{width:100%;font:inherit;padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:#fff}
dl.g dt{font-weight:600;color:var(--navy);margin-top:12px}dl.g dd{margin:2px 0 0}
table.adm{width:100%;border-collapse:collapse;font-size:14px;display:block;overflow-x:auto}table.adm th,table.adm td{border-bottom:1px solid var(--line);padding:8px;text-align:left;white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}.stat b{font-size:24px;color:var(--navy);display:block;line-height:1.1}.stat span{font-size:12px;color:var(--mute)}
.soon{opacity:.75}.ccard{display:block;text-decoration:none;color:inherit;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:12px}
.ccard .cv{padding:16px;color:#fff;min-height:84px}.ccard .cv b{font-size:22px;display:block;line-height:1.2}.ccard .cv span{font-size:13px;opacity:.92}
.ccard .cb{padding:12px 16px 16px}.ccard p{margin:0 0 8px;font-size:14px;color:var(--mute)}
.mod h2{font-size:17px;margin:20px 0 8px}
.item .k{font-size:11px;font-weight:600;color:var(--blue);text-transform:none}
.concept{background:#F1F5FF;border-left:4px solid var(--blue);border-radius:0 12px 12px 0;padding:6px 14px;margin:10px 0}
details.mat summary{font-weight:600;color:var(--navy);cursor:pointer;min-height:32px}
.lesson h3{margin-top:1.4em}.lesson ul{padding-left:20px}
@media(min-width:700px){.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.cgrid .ccard{margin:0}}

@media(min-width:900px){body{padding-left:210px}nav.tabs{top:54px;bottom:0;right:auto;width:210px;flex-direction:column;border-top:0;border-right:1px solid var(--line);padding-top:8px}nav.tabs a{flex:none;flex-direction:row;font-size:14px;justify-content:flex-start;padding:12px 18px;gap:10px;box-shadow:none!important;min-height:44px}nav.tabs a[aria-current=page]{background:#EAF0FF;border-left:4px solid var(--orange)}header.top{margin-left:-210px;padding-left:226px}main{padding-bottom:40px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== marca: Wesley Mendes (Poppins, azul e laranja) ===== */
:root{--board:#1447D6;--chalk:#fff;--navy:#082E9C;--blue:#1447D6;--sky:#48A8F6;--orange:#F68B1F;--yellow:#F7B547;--ink:#2D2D2D;--mute:#4A5568;--bg:#F2F5F7;--card:#fff;--line:#D5DCE5;--ok:#0F7B4B;--okbg:#E5F6EE;--bad:#B3261E;--r:10px;--serif:Poppins,system-ui,sans-serif;--sans:Poppins,system-ui,sans-serif;--grad:linear-gradient(135deg,#082E9C 0%,#1447D6 55%,#48A8F6 130%)}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:16px}
h1,h2,h3{font-family:var(--serif);color:var(--ink);font-weight:700;letter-spacing:-.005em}
h1{font-size:27px;font-weight:800;line-height:1.2}h2{font-size:21px}

header.top{background:var(--navy);border-bottom:3px solid var(--orange)}

header.top img{border-radius:8px}
.who,.lvl{border-radius:8px;background:rgba(255,255,255,.16)}

.card{border-radius:var(--r);border:1px solid var(--line)}

.bar{height:4px;background:#D5DCE5;border-radius:99px}.bar>i{background:var(--board);border-radius:99px}
.pill,.pill.ok,.pill.or,.pill.bad{background:transparent;border:1px solid currentColor;border-radius:8px;font-weight:600;color:var(--mute);padding:1px 8px}.pill.ok{color:var(--ok)}.pill.bad{color:var(--bad)}
.item{border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;padding:12px 2px}
.item .dot{border-radius:8px;border:1.5px solid var(--ink);color:var(--ink);font-family:var(--serif)}.item .dot.done{background:var(--board);border-color:var(--board);color:var(--chalk)}

.lesson th{background:var(--navy);color:var(--chalk);font-family:var(--sans)}.lesson td,.lesson th{border-color:var(--line)}.lesson table{font-family:var(--sans);font-size:15px}

.board{background:var(--grad);color:var(--chalk);border-radius:var(--r);position:relative;overflow:hidden}

.wd{border-radius:8px;border:1.5px solid var(--ink);color:var(--ink)}.wd.on{background:var(--board);border-color:var(--board);color:var(--chalk)}

.trilha{background:transparent;border:0;border-top:1px solid var(--line);border-radius:99px}

.tn .tl{background:var(--bg);border-radius:8px;font-family:var(--sans);font-size:13px}

.mminfo{border-radius:var(--r)}

body.foco .lesson{font-size:20px}
#ftg{min-height:44px;font-size:15px;padding:8px 14px}

.fig svg *{transform-box:fill-box}
.fig.go .fbar{transform-origin:bottom;animation:figgrow .9s ease-out both}
.fig.go .hb{transform-origin:center;animation:figx .8s ease-out both}

.fig.go .trap{animation:figtrap 2.6s ease-in-out infinite}

  for(const k in S.quiz){const r=S.quiz[k];if(r&&!r.x&&has(QS,k)){x+=5;if(r.ok)x+=5}}
  for(const k in (S.rev||{})){const r=S.rev[k];if(r&&!r.x)x+=3*(r.n||0)}return x}
const lvlOf=x=>({n:Math.floor(x/100)+1,into:x%100});

function studyDays(){const s=new Set();const add=t=>{t=+t||0;if(t>1e11)s.add(dayKey(new Date(t)))};
  for(const k in S.lessons)if(S.lessons[k]>0)add(S.lessons[k]);
  for(const k in S.quiz){const r=S.quiz[k];if(r&&!r.x)add(r.t)}
  for(const k in (S.rev||{})){const r=S.rev[k];if(r&&!r.x)add(r.u)}return s}

      const v=(S.rev||{})[id]&&!S.rev[id].x?S.rev[id]:{s:0,n:0};
      if(ok){const s=(v.s||0)+1;S.rev=S.rev||{};S.rev[id]={s,n:(v.n||0)+1,d:s<STEPS.length?n+STEPS[s]*DAY:0,u:n};RD.ok++}
      else{S.rev=S.rev||{};S.rev[id]={s:0,n:v.n||0,d:n+DAY,u:n}}

  ${settingsCard()}${UI.game?progCard():''}<h2>Revisar</h2>${bad.length?bad.map(i=>`<a class="item" href="#questao-${i}"><span class="dot" style="background:var(--bad);border-color:var(--bad)" aria-hidden="true">✗</span><span><b>${esc(CB[QS[i].course].titulo)} · Questão ${QS[i].n}</b><small>${esc(QS[i].tema)}</small></span></a>`).join(''):'<p>Nenhuma questão errada. Continue assim.</p>'}
  <p><button class="btn ghost" id="rs">Zerar meu progresso</button></p>`;
  bindSettings(m,()=>vProg(m));
  $('#rs').onclick=()=>{if(confirm('Apagar todo o seu progresso? Isso não pode ser desfeito.')){const n=Date.now();const nl={},nq={};Object.keys(LES).forEach(k=>nl[k]=-n);Object.keys(QS).forEach(k=>nq[k]={x:1,t:n});const rv={};Object.keys(S.rev||{}).forEach(k=>rv[k]={x:1,u:n});S={lessons:nl,quiz:nq,rev:rv};persist();vProg(m)}};
}
function vProf(m){
  if(!ctx.admin){m.innerHTML='<div class="card"><b>Área restrita.</b> Só o professor acessa este painel.</div>';return}
  m.innerHTML=`<h1>Painel do professor</h1><div id="pa" class="stats"></div><h2>Aviso para a turma</h2><div class="card"><label for="av">Texto do aviso (aparece na página inicial dos alunos)</label><textarea id="av" rows="2" maxlength="300"></textarea><p><button class="btn" id="avs">Publicar aviso</button> <span id="avm" role="status"></span></p><div id="avl"></div></div>${window.PROF_EMAIL?`<h2>Acesso dos alunos</h2><div class="card"><label for="ac">E-mails Google liberados (um por linha)</label><textarea id="ac" rows="3" placeholder="aluno@gmail.com"></textarea><fieldset style="border:0;padding:0;margin:8px 0"><legend>Cursos liberados para esses e-mails</legend>${CAT.map(c=>`<label style="display:inline-flex;gap:6px;margin-right:14px;align-items:center"><input type="checkbox" class="acc" value="${c.id}" ${c.id==='geo'?'checked':''}> ${esc(c.titulo)}</label>`).join('')}</fieldset><p><button class="btn" id="acs">Liberar</button> <span id="acm" role="status"></span></p><div id="acl"></div></div><h2>Chaves dos cursos</h2><div class="card"><p>Os cursos ficam criptografados no site. Só quem você libera recebe a chave. Cole aqui o texto das chaves (JSON) para publicar ou atualizar.</p><label for="ck">Chaves (JSON)</label><textarea id="ck" rows="3" autocomplete="off"></textarea><p><button class="btn" id="cks">Publicar chaves</button> <span id="ckm" role="status"></span></p></div>`:''}<h2>Alunos</h2><div id="tb">Carregando…</div><h2>Desempenho por curso</h2><div id="cs"></div><h2>Desempenho por questão</h2><div id="qs"></div>`;
  let rows=[];const names={};
  const tm=setTimeout(()=>{$('#tb').textContent='Sem resposta do banco ainda. Se ninguém salvou progresso, a lista fica vazia.'},10000);
  const cnt=d=>{const nl=Object.values(d.lessons||{}).filter(v=>v>0).length;const qz=Object.entries(d.quiz||{}).filter(([k,v])=>v&&!v.x);return{nl,nq:qz.length,ok:qz.filter(([k,v])=>v.ok).length}};
  async function render(){
    const ids=rows.map(r=>r.id);try{if(ctx.user&&ids.length){const ps=await ctx.user.profiles(ids);ids.forEach(i=>names[i]=(ps[i]&&ps[i].name)||'')}}catch(e){}
    const act=d=>Math.max(0,...Object.values(d.lessons||{}).filter(v=>v>0),...Object.values(d.quiz||{}).filter(v=>v&&!v.x).map(v=>v.t||0));
    rows.forEach(r=>{if(!names[r.id]&&r.d&&(r.d.name||r.d.email))names[r.id]=(r.d.name||'')+(r.d.email?' ('+r.d.email+')':'')});const tb=rows.map(r=>({id:r.id,...cnt(r.d),t:act(r.d)})).filter(x=>x.nl||x.nq);
    const tq=tb.reduce((a,x)=>a+x.nq,0),to=tb.reduce((a,x)=>a+x.ok,0);
    $('#pa').innerHTML=`<div class="stat"><b>${tb.length}</b><span>alunos com progresso</span></div><div class="stat"><b>${tq}</b><span>questões respondidas</span></div><div class="stat"><b>${tq?Math.round(to/tq*100):0}%</b><span>acerto geral</span></div>`;
    const t=document.createElement('table');t.className='adm';t.innerHTML='<thead><tr><th>Aluno</th><th>Aulas lidas</th><th>Questões</th><th>Acertos</th><th>Última atividade</th></tr></thead>';
    const tbd=document.createElement('tbody');
    tb.sort((a,b)=>b.t-a.t).forEach(x=>{const tr=document.createElement('tr');[(names[x.id]||('Aluno '+x.id.slice(0,6))),x.nl,x.nq,x.nq?Math.round(x.ok/x.nq*100)+'%':'—',x.t?new Date(x.t).toLocaleString('pt-BR'):'—'].forEach(v=>{const td=document.createElement('td');td.textContent=v;tr.appendChild(td)});tbd.appendChild(tr)});
    t.appendChild(tbd);$('#tb').innerHTML='';if(tb.length)$('#tb').appendChild(t);else $('#tb').textContent='Nenhum aluno salvou progresso ainda.';
    $('#cs').innerHTML=C.map(c=>{const ls=c.flow.filter(x=>x[0]==='l').map(x=>x[1]),qq=cQ(c);let al=0,n=0,o=0,stu=0;rows.forEach(r=>{const a=ls.filter(i=>(r.d.lessons||{})[i]>0).length;const b=qq.filter(i=>{const x=(r.d.quiz||{})[i];return x&&!x.x});if(a||b.length)stu++;al+=a;b.forEach(i=>{n++;if(r.d.quiz[i].ok)o++})});return `<div class="card"><div class="row" style="justify-content:space-between"><b>${esc(c.titulo)}</b><span>${stu} aluno(s) ativo(s)</span></div><p style="margin:6px 0;font-size:14px">${al} aulas lidas · ${n?Math.round(o/n*100)+'% de acerto ('+o+'/'+n+')':'sem respostas'}</p>${bar(n?Math.round(o/n*100):0)}</div>`}).join('');
    $('#qs').innerHTML='<details class="card mat"><summary>Ver as '+Object.keys(QS).length+' questões</summary>'+Object.values(QS).map(q=>{let n=0,o=0;rows.forEach(r=>{const x=(r.d.quiz||{})[q.id];if(x&&!x.x){n++;if(x.ok)o++}});return `<div style="margin:10px 0"><div class="row" style="justify-content:space-between"><span>${esc(CB[q.course].titulo)} · Q${q.n}</span><span>${n?Math.round(o/n*100)+'% ('+o+'/'+n+')':'—'}</span></div>${bar(n?Math.round(o/n*100):0)}</div>`}).join('')+'</details>';
  }
  if(ctx.db){
    cleanup.push(ctx.db.collection('progress').onSnapshot(s=>{clearTimeout(tm);rows=s.docs.map(d=>({id:d.id,d:d.data()}));render()},e=>{clearTimeout(tm);$('#tb').textContent='Erro ao ler alunos: '+(e&&e.code)}));
    cleanup.push(ctx.db.collection('avisos').orderBy('t','desc').limit(5).onSnapshot(s=>{const el=$('#avl');if(!el)return;el.innerHTML='';s.docs.forEach(d=>{const p=document.createElement('p');p.textContent=d.data().texto+' ';const b=document.createElement('button');b.className='btn ghost';b.textContent='Remover';b.setAttribute('aria-label','Remover aviso: '+(d.data().texto||'').slice(0,40));b.onclick=async()=>{try{await ctx.db.doc('avisos/'+d.id).delete()}catch(e){$('#avm').textContent='Erro ao remover: '+(e&&e.code)}};p.appendChild(b);el.appendChild(p)})},()=>{}));
    $('#avs').onclick=async()=>{const t=$('#av').value.trim();if(!t)return;try{await ctx.db.collection('avisos').add({texto:t,t:Date.now()});$('#av').value='';$('#avm').textContent='Publicado.'}catch(e){$('#avm').textContent='Erro: '+(e&&e.code)}};
    if(window.PROF_EMAIL){
      cleanup.push(ctx.db.collection('acessos').onSnapshot(s=>{const el=$('#acl');if(!el)return;el.innerHTML='';const ids=s.docs.map(d=>d.id).sort();if(!ids.length)el.textContent='Nenhum aluno liberado ainda.';ids.forEach(id=>{const p=document.createElement('p');const cs=(d=>Array.isArray(d.cursos)?d.cursos.map(x=>(CAT.find(k=>k.id===x)||{}).titulo||x).join(', '):'todos os cursos')(s.docs.find(z=>z.id===id).data());p.textContent=id+' · '+cs+' ';const b=document.createElement('button');b.className='btn sec';b.textContent='Remover';b.setAttribute('aria-label','Remover acesso de '+id);b.onclick=()=>{if(confirm('Remover o acesso de '+id+'?'))ctx.db.doc('acessos/'+id).delete().catch(e=>{$('#acm').textContent='Erro: '+(e&&e.code)})};p.appendChild(b);el.appendChild(p)})},e=>{const el=$('#acl');if(el)el.textContent='Erro ao ler acessos: '+(e&&e.code)}));
      $('#acs').onclick=async()=>{const ids=[...new Set($('#ac').value.toLowerCase().split(/[\s,;]+/).filter(x=>/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(x)))];if(!ids.length){$('#acm').textContent='Digite ao menos um e-mail válido.';return}const cur=[...document.querySelectorAll('.acc:checked')].map(x=>x.value);if(!cur.length){$('#acm').textContent='Marque ao menos um curso.';return}try{for(const id of ids)await ctx.db.doc('acessos/'+id).set({criadoEm:Date.now(),cursos:cur});$('#ac').value='';$('#acm').textContent=ids.length+' liberado(s).'}catch(e){$('#acm').textContent='Erro: '+(e&&e.code)}};
      $('#cks').onclick=async()=>{let o;try{o=JSON.parse($('#ck').value)}catch(e){$('#ckm').textContent='Texto inválido: cole o JSON completo.';return}const ids=Object.keys(o).filter(k=>/^[a-z0-9-]+$/.test(k)&&typeof o[k]==='string'&&o[k].length>=40);if(!ids.length){$('#ckm').textContent='Nenhuma chave válida.';return}try{for(const id of ids)await ctx.db.doc('chaves/'+id).set({k:o[id]});$('#ck').value='';$('#ckm').textContent='Publicadas: '+ids.join(', ')+'. Recarregue a página.'}catch(e){$('#ckm').textContent='Erro: '+(e&&e.code)}};
    }
  }else{$('#tb').textContent='Banco indisponível nesta visualização.'}
}
init();
</script></body></html>
